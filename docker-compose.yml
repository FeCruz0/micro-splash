version: '3.8'

services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Mapeia pasta local para dentro do container (Hot-Reloading em tempo real)
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Garante que alterações nos arquivos sejam detectadas no Linux/Docker