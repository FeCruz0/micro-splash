server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para performance em redes móveis e totens
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cabeçalhos básicos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Roteamento SPA: Qualquer rota inexistente retorna index.html (200 OK)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker e manifesto PWA: nunca cachear agressivamente no navegador
    location ~* (sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Assets estáticos com hash gerados pelo Vite (imutáveis)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sprites e ícones com cache diário
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|mp3|ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Healthcheck para monitoramento de totens e orquestradores
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
