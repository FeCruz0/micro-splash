name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Validar Formatação (Prettier)
        run: npm run format:check

      - name: Executar Lint (ESLint 9)
        run: npm run lint

      - name: Validar Schemas de Dados Educacionais (Zod)
        run: npm run validate:data

      - name: Executar Testes com Cobertura (Vitest)
        run: npm run coverage

      - name: Compilar Bundle de Produção (Vite + TypeScript)
        run: npm run build

      - name: Preservar Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist/
          retention-days: 7
