name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para deploy seguro no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build do Bundle de Produção
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Aplicação
        run: npm run build

      - name: Configurar Artefato para Deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-pages:
    name: Publicação (GitHub Pages / Web)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy para Cloudflare Pages (Opcional)
    needs: build
    runs-on: ubuntu-latest
    if: false # Ativar quando as credenciais CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID forem adicionadas aos Secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Baixar Artefato
        uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=micro-splash
